name: Build Android APK
on:
  push:
    branches: [main]
    paths: [mobile/**, .github/workflows/android.yml]
  workflow_dispatch:
permissions:
  contents: write
concurrency: { group: apk, cancel-in-progress: true }
jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - run: npm ci
      - run: npm run build
      - run: npx cap add android && npx cap sync android
      # 毎回同じ鍵で署名し、更新時に上書きインストールできるようにする (データが消えない)
      - run: |
          cat >> android/app/build.gradle <<'GRADLE'
          android {
              signingConfigs {
                  debug {
                      storeFile file("${rootDir}/../debug.keystore")
                      storePassword "android"
                      keyAlias "androiddebugkey"
                      keyPassword "android"
                  }
              }
              buildTypes { debug { signingConfig signingConfigs.debug } }
          }
          GRADLE
      # 作品を端末の Documents に保存するための権限 (Android 9 以下) と Android 10 の旧ストレージ方式
      - run: |
          m=android/app/src/main/AndroidManifest.xml
          sed -i 's#<application#<uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="29" />\n    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32" />\n    <application android:requestLegacyExternalStorage="true"#' $m
          grep -q requestLegacyExternalStorage $m
      - run: cd android && ./gradlew assembleDebug --no-daemon -q
      - run: cp android/app/build/outputs/apk/debug/app-debug.apk ../personalizeAI.apk
      - name: Verify signing key
        run: |
          got=$(python3 scripts/apkcert.py ../personalizeAI.apk | awk '{print $2}')
          want=$(keytool -list -v -keystore debug.keystore -storepass android | grep 'SHA256:' | head -1 | awk '{print $2}' | tr -d ':')
          echo "got=$got want=$want"; test "$got" = "$want"
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: app-latest
          name: personalizeAI アプリ (最新版)
          body: |
            スマホでこのページを開き、下の **personalizeAI.apk** をタップしてインストールしてください。
            (初回のみ「提供元不明のアプリ」の許可が必要です)
          files: personalizeAI.apk
          make_latest: true
