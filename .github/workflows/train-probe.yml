name: train-probe
on:
  push:
    branches: [claude/compassionate-volta-pqts6v]
    paths: [.github/workflows/train-probe.yml]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with: { python-version: "3.10" }
      - run: |
          git clone -q --depth 1 --branch v0.9.1 https://github.com/kohya-ss/sd-scripts /tmp/sd && cd /tmp/sd
          pip install -q torch==2.4.1 torchvision==0.19.1
          pip install -q -r requirements.txt "numpy<2" onnx onnxruntime pillow-heif "huggingface_hub[hf_transfer]"
          python -c "import library.sdxl_model_util, library.train_util; from transformers import CLIPTextModel; import onnxruntime, pillow_heif, bitsandbytes; print('IMPORT OK')"
          python sdxl_train_network.py --help | head -3
          python finetune/tag_images_by_wd14_tagger.py --help | head -3
          pip list 2>/dev/null | grep -iE "^(torch|transformers|diffusers|numpy|huggingface)"
